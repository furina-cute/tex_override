; tex_override sample configuration
; Rename this file to TextureOverride.ini (next to the game executable, i.e. next to dxgi.dll /
; ReShade.ini) and edit the rules. You can also create rules from the in-game overlay while
; Hunting Mode is active, then press "Save to INI".
;
; Boolean logic:
;   - inside one section every written condition must match (AND); omitted = wildcard
;   - sections are OR'ed, higher match_priority wins, ties keep file order
;
; Stable anchors (identical after every process restart):
;   match_ps_hash = CRC32C of the pixel shader DXBC bytecode
;   match_vs_hash = CRC32C of the vertex shader DXBC bytecode
;   match_first_index / match_index_count = DrawIndexed geometry range (also stable)
;
; Texture hash (may drift when a game repacks dynamic atlases):
;   hash = <descriptor or pixel hash>   |   hash = *   |   omit the line
;
; hash_mode: descriptor (fast metadata hash) or pixel (content hash, CPU upload only)
; A rule needs at least one of: hash (not *), match_ps_hash, match_vs_hash.

[Settings]
hash_mode = descriptor
; 1 = 安全模式：禁用 replace 与像素哈希。怀疑插件引发蓝屏/系统重启时先设成 1 做二分。
safe_mode = 0

; Preferred form: only stable anchors, survives atlas repacking across restarts.
[TextureOverrideNameCard]
match_ps_hash = 0x1a2b3c4d
match_vs_hash = 0x5e6f7a8b
match_index_count = 420
handling = skip
active = 1

; Stable anchors + texture hash: most precise, but the texture hash may drift.
[TextureOverrideUID]
hash = 83fd403f
match_ps_hash = 0x1a2b3c4d
match_first_index = 0
handling = skip
active = 1

; Legacy style (texture hash only) is still accepted.
[TextureOverrideLegacy]
hash = a1b2c3d4
match_first_index = 0, 512
match_index_count = 100-500
match_priority = 1
handling = skip
active = 0
